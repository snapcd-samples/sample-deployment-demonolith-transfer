# The simulated remote state store: MinIO, an S3-compatible object store, in
# one container. Every root's state lives in its `tfstate` bucket; nothing
# here touches AWS, and the AWS_*-shaped credentials authenticate against
# this container only.
#
# Start it with ./step0_store.sh, which also creates the bucket and waits
# for readiness from the outside — the container deliberately carries no
# healthcheck.
services:
  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
